name: odds-watcher

on:
  schedule:
    # run at :05 every hour (UTC); script decides whether to fire by Belgrade time
    - cron: '5 * * * *'
  workflow_dispatch:
    inputs:
      ymd:
        description: 'Override date (YYYY-MM-DD)'
        required: false
        type: string
      slot:
        description: 'Slot: late | am | pm'
        required: false
        type: choice
        options: [late, am, pm]
      debug:
        description: 'Append debug flag'
        required: false
        type: boolean

jobs:
  refresh-odds:
    runs-on: ubuntu-latest
    env:
      # Optional: set your public base URL via repo/env/Org secrets
      BASE_URL: ${{ secrets.NEXT_PUBLIC_BASE_URL }}
      # Optional: shared cron key if your API expects it
      CRON_KEY: ${{ secrets.CRON_KEY }}
      TZ_REGION: Europe/Belgrade

    steps:
      - name: Compute Belgrade date/slot (or use inputs)
        id: calc
        shell: bash
        env:
          IN_YMD:  ${{ github.event.inputs.ymd }}
          IN_SLOT: ${{ github.event.inputs.slot }}
          IN_DBG:  ${{ github.event.inputs.debug }}
        run: |
          set -euo pipefail

          # Always define NOW_BG first so it's never "unbound"
          NOW_BG="$(TZ="${TZ_REGION}" date -Iseconds)"
          HOUR_BG="$(TZ="${TZ_REGION}" date +%H)"

          # Inputs are optional; guard with :- to be safe under 'set -u'
          YMD="${IN_YMD:-$(TZ="${TZ_REGION}" date +%F)}"
          SLOT_IN="${IN_SLOT:-}"

          if [ -n "$SLOT_IN" ]; then
            SLOT="$SLOT_IN"
          else
            # Auto slot by Belgrade hour
            if   [ "$HOUR_BG" -lt 10 ]; then SLOT="late"
            elif [ "$HOUR_BG" -lt 15 ]; then SLOT="am"
            else                            SLOT="pm"
            fi
          fi

          # Optional debug flag (appended as &debug=1)
          DBG=""
          if [ "${IN_DBG:-false}" = "true" ]; then DBG="&debug=1"; fi

          # Fire only at 00 / 10 / 15 Belgrade hours
          TRIGGER="0"
          if [ "$HOUR_BG" = "00" ] || [ "$HOUR_BG" = "10" ] || [ "$HOUR_BG" = "15" ]; then
            TRIGGER="1"
          fi

          {
            echo "NOW_BG=$NOW_BG"
            echo "HOUR_BG=$HOUR_BG"
            echo "YMD=$YMD"
            echo "SLOT=$SLOT"
            echo "DBG=$DBG"
            echo "TRIGGER=$TRIGGER"
          } >> "$GITHUB_ENV"

          echo "Computed (BG): NOW=$NOW_BG HOUR=$HOUR_BG YMD=$YMD SLOT=$SLOT TRIGGER=$TRIGGER"

      - name: Skip if not slot time (Belgrade)
        shell: bash
        run: |
          set -euo pipefail
          if [ "${TRIGGER:-0}" != "1" ]; then
            echo "Not a slot hour in ${TZ_REGION} (HOUR_BG=${HOUR_BG:-n/a}). Skipping."
            exit 0
          fi

      - name: Call refresh-odds
        shell: bash
        run: |
          set -euo pipefail

          URL_BASE="${BASE_URL:-https://predictscores.vercel.app}"
          Q="slot=${SLOT}&ymd=${YMD}"

          # Optional shared key if your API requires it
          if [ -n "${CRON_KEY:-}" ]; then
            # Use a generic 'key' param; adjust if your API expects a different name
            Q="${Q}&key=${CRON_KEY}"
          fi

          # Optional debug flag carried from compute step
          if [ -n "${DBG:-}" ]; then
            Q="${Q}${DBG}"
          fi

          URL="${URL_BASE}/api/cron/refresh-odds?${Q}"
          echo "Calling: ${URL} (NOW_BG=${NOW_BG:-n/a})"

          # Fast-fail, silent on HTTP errors, with reasonable timeout
          HTTP_CODE="$(curl -sS -w '%{http_code}' -o /tmp/resp.json --max-time 60 "${URL}")"
          echo "HTTP ${HTTP_CODE}"
          cat /tmp/resp.json || true

          if [ "${HTTP_CODE}" -lt 200 ] || [ "${HTTP_CODE}" -ge 300 ]; then
            echo "Request failed with HTTP ${HTTP_CODE}"
            exit 1
          fi
