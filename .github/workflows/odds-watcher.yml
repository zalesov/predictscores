name: odds-watcher

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      BASE: https://predictscores.vercel.app
    steps:
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Compute YMD & SLOT (Europe/Belgrade)
        id: when
        run: |
          YMD=$(TZ=Europe/Belgrade date +%F)
          H=$(TZ=Europe/Belgrade date +%H)
          if   [ "$H" -lt 12 ]; then SLOT=am;
          elif [ "$H" -lt 17 ]; then SLOT=pm;
          else                         SLOT=late; fi
          echo "ymd=$YMD"   >> $GITHUB_OUTPUT
          echo "slot=$SLOT" >> $GITHUB_OUTPUT

      - name: Probe locked (items) and union length
        id: probe
        run: |
          Y="${{ steps.when.outputs.ymd }}"
          S="${{ steps.when.outputs.slot }}"
          LOCKED="$(curl -fsS "$BASE/api/value-bets-locked?ymd=$Y&slot=$S&slim=1" || echo '{}')"
          ITEMS="$(echo "$LOCKED" | jq -r '.items | length // 0')"
          UNION="$(curl -fsS "$BASE/api/debug/kv?key=vb:day:$Y:union" || echo '{}')"
          ULEN="$(echo "$UNION" | jq -r '.kv.value | length // 0')"
          echo "items=$ITEMS" >> $GITHUB_OUTPUT
          echo "ulen=$ULEN"   >> $GITHUB_OUTPUT

      - name: Skip when empty (save API calls)
        if: steps.probe.outputs.items == '0' || steps.probe.outputs.ulen == '0'
        run: |
          echo "Skipping: items=${{ steps.probe.outputs.items }}, union=${{ steps.probe.outputs.ulen }}"
          exit 0

      - name: Refresh odds (guarded)
        if: steps.probe.outputs.items != '0' && steps.probe.outputs.ulen != '0'
        run: |
          Y="${{ steps.when.outputs.ymd }}"
          S="${{ steps.when.outputs.slot }}"
          curl -fsS "$BASE/api/cron/refresh-odds?ymd=$Y&slot=$S&debug=1"
