name: odds-watcher

on:
  schedule:
    # Europe/Belgrade 00:00  -> UTC 22:00 (prethodni dan)
    - cron: "0 22 * * *"
    # Europe/Belgrade 10:00  -> UTC 08:00
    - cron: "0 8 * * *"
    # Europe/Belgrade 15:00  -> UTC 13:00
    - cron: "0 13 * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Set up job
        run: echo "Starting odds-watcher"

      - name: Install jq
        run: |
          sudo apt-get update -y
          sudo apt-get install -y jq

      - name: Compute YMD & SLOT (Europe/Belgrade)
        id: when
        env:
          TZ: Europe/Belgrade
        run: |
          YMD=$(TZ=Europe/Belgrade date +%F)
          HOUR=$(TZ=Europe/Belgrade date +%H)
          if [ "$HOUR" -lt 12 ]; then SLOT="am"; elif [ "$HOUR" -lt 17 ]; then SLOT="pm"; else SLOT="late"; fi
          echo "ymd=$YMD"   >> $GITHUB_OUTPUT
          echo "slot=$SLOT" >> $GITHUB_OUTPUT
          echo "Belgrade now: $YMD $HOUR:00 -> slot=$SLOT"

      - name: Rebuild snapshot (+union)
        env:
          BASE: ${{ secrets.BASE_URL }}
        run: |
          curl -fsS "$BASE/api/cron/rebuild?ymd=${{ steps.when.outputs.ymd }}&slot=${{ steps.when.outputs.slot }}&debug=1"

      - name: Apply learning (write vbl_full)
        env:
          BASE: ${{ secrets.BASE_URL }}
        run: |
          curl -fsS "$BASE/api/cron/apply-learning?ymd=${{ steps.when.outputs.ymd }}&slot=${{ steps.when.outputs.slot }}&debug=1"

      - name: Refresh odds (guarded + lock/meta)
        env:
          BASE: ${{ secrets.BASE_URL }}
        run: |
          curl -fsS "$BASE/api/cron/refresh-odds?ymd=${{ steps.when.outputs.ymd }}&slot=${{ steps.when.outputs.slot }}&debug=1"

      - name: Complete job
        run: echo "Done."
